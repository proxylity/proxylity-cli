name: Release

# Triggered by publishing a GitHub Release whose tag is a plain semantic version
# (for example 1.2.3 or 1.3.0-rc.1, with no "v" prefix). A tag containing "-" is a prerelease and the
# GitHub Release is marked as such. Archives include the LICENSE. Release assets are SHA256SUMS, a
# CycloneDX SBOM, and build-provenance and SBOM attestations for the archives.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  gate:
    name: Publish gate
    uses: ./.github/workflows/gate.yml
    with:
      mode: Release
    secrets: inherit

  verify:
    name: Verify tag and run tests
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Validate tag and compute version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: ./eng/Get-Version.ps1 -Tag $env:RELEASE_TAG

      - name: Require release commit to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Build and test
        run: |
          dotnet build --configuration Release "-p:Version=${{ steps.version.outputs.version }}"
          dotnet test --configuration Release --no-build

  package:
    name: Package (${{ matrix.rid }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Publish
        run: >
          dotnet publish src/Proxylity.Cli
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:DebugType=none
          "-p:Version=${{ needs.verify.outputs.version }}"
          --output out/${{ matrix.rid }}

      - name: Archive
        shell: bash
        run: |
          name="proxylity-${{ needs.verify.outputs.version }}-${{ matrix.rid }}"
          mkdir -p dist
          cp LICENSE out/${{ matrix.rid }}/LICENSE
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            (cd out/${{ matrix.rid }} && zip -q "../../dist/${name}.zip" proxylity.exe LICENSE)
          else
            tar -C out/${{ matrix.rid }} -czf "dist/${name}.tar.gz" proxylity LICENSE
          fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: package-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  sbom:
    name: Software bill of materials
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Generate CycloneDX SBOM
        run: |
          dotnet tool restore
          dotnet tool run dotnet-CycloneDX Proxylity.Cli.slnx --output sbom --filename proxylity-${{ needs.verify.outputs.version }}.sbom.json --output-format Json

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sbom
          path: sbom/*
          if-no-files-found: error

  publish-assets:
    name: Attach assets to release
    needs: [verify, package, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to upload release assets
      id-token: write # required to sign attestations
      attestations: write # required to store attestations
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: dist
          pattern: package-*
          merge-multiple: true

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: sbom
          name: sbom

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
          sbom-path: sbom/proxylity-${{ needs.verify.outputs.version }}.sbom.json

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* sbom/* --clobber --repo "$GITHUB_REPOSITORY"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --prerelease --repo "$GITHUB_REPOSITORY"
          fi
