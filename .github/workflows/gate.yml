name: Publish gate

# Checks that keep sensitive or non-public material out of the repository and
# keep dependencies and workflows safe. Runs on every PR and push to main, and is
# required (in release mode) before a release is built; see release.yml.
#
# Release mode additionally requires the private denylist secret and rejects
# unfinished-work placeholder markers.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      mode:
        description: 'Check or Release'
        type: string
        default: Release
  workflow_dispatch:
    inputs:
      mode:
        description: 'Check or Release'
        type: choice
        options: [Check, Release]
        default: Release

permissions:
  contents: read

env:
  GATE_MODE: ${{ inputs.mode || 'Check' }}
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Scan full history
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

  denylist:
    name: Denylist scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan files, history and commit messages
        shell: pwsh
        env:
          # Private patterns live only in this repository secret, never in the repo.
          # Not available to pull requests from forks; Check mode warns, Release mode fails.
          PRIVATE_DENYLIST: ${{ secrets.PRIVATE_DENYLIST }}
        run: ./eng/gate/Test-Denylist.ps1 -Mode $env:GATE_MODE

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Check licenses
        shell: pwsh
        run: ./eng/gate/Test-Licenses.ps1

  workflow-pins:
    name: Actions pinned to SHAs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check pins
        shell: pwsh
        run: ./eng/gate/Test-ActionPins.ps1
